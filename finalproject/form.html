<main class="form-container">

  <form action="form-action.html" method="GET" class="form-box">

    <label>
      Your Name
      <input
        type="text"
        name="name"
        placeholder="Enter your name"
        required>

    <label>
      Favorite Food
      <input
        type="text"
        name="food"
        placeholder="Enter your favorite food"
        required>
    </label>

    <button type="submit">Submit</button>

  </form>

</main>
