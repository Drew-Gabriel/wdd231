<body>

<header>
  <div class="logo-container">
    <img src="images/logo.png" alt=" Benin City Chamber Logo" width="50" height="50>

  </div>

<nav>
  <ul class="navigation">

  </ul>
</nav>
</header>

<main>
<h2>Chamber Membership Application</h2>

<form method="get" action="thankyou.html">

<label>
First Name
<input type="text"
name="firstname"
required
title="Enter first name"
autocomplete="given-name">
</label>

<label>
Last Name
<input type="text"
name="lastname"
required
title="Enter last name"
autocomplete="family-name">
</label>

<label>
Organization Title
<input type="text"
name="orgtitle"
title="Enter organization title"
autocomplete="organization-title"
pattern="[A-Za-z\\- ]{7,}">
</label>

<label>
Email
<input type="email"
name="email"
required
placeholder="taiye@email.com"
title="Enter email"
autocomplete="email">
</label>

<label>
Mobile Number
<input type="tel"
name="phone"
required
title="Enter phone number"
autocomplete="tel">
</label>

<label>
Business Name
<input type="text"
name="business"
required
title="Business name"
autocomplete="organization">
</label>

<label>
Membership Level
<select name="membership">

<option value="np">NP Membership</option>
<option value="bronze">Bronze</option>
<option value="silver">Silver</option>
<option value="gold">Gold</option>

</select>
</label>

<label>
Business Description
<textarea
name="description"
title="Business description">
</textarea>
</label>

<input type="hidden"
id="timestamp"
name="timestamp">

<input type="submit"
value="Submit Application">

</form>

</main>

  </div>

</footer>

</body>
</html>
